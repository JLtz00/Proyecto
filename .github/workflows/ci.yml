name: NBO quality gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reproducible environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest
      - name: Verify data, artifacts and reference cases
        run: python -m nbo.bootstrap
      - name: Smoke evaluation v3
        run: python -m nbo.evaluation_v3 --max-events 50 --bootstrap-iterations 20 --output-dir artifacts/ci-evaluation
      - name: Secret pattern check
        run: |
          secret_pattern='(gh''p_|github_''pat_|s''k-[A-Za-z0-9]{20,}|pass''word[[:space:]]*=[[:space:]]*[^$])'
          if git grep -nEi "$secret_pattern" -- ':!artifacts/*.joblib'; then
            echo "Potential secret detected in tracked files."
            exit 1
          fi
