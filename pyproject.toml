[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movistar-nbo"
version = "0.1.0"
description = "Motor reproducible de Next Best Offer para el reto de personalizacion comercial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.5",
  "fastapi>=0.115",
  "Flask>=3.1",
  "Flask-WTF>=1.2",
  "httpx>=0.27",
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.30",
  "waitress>=3.0",
]

[project.optional-dependencies]
explain = ["shap>=0.46"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
media = ["Pillow>=10.4", "imageio-ffmpeg>=0.5"]

[project.scripts]
nbo-train = "nbo.training:main"
nbo-evaluate = "nbo.evaluation:main"
nbo-evaluate-v3 = "nbo.evaluation_v3:main"
nbo-batch = "nbo.batch:main"
nbo-report = "nbo.reporting:main"
nbo-audit = "nbo.audit:main"
nbo-demo = "nbo.demo:main"
nbo-check = "nbo.bootstrap:main"
nbo-advisor = "nbo.advisor_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nbo.advisor_app" = [
  "templates/*.html",
  "templates/partials/*.html",
  "static/css/*.css",
  "static/js/*.js",
  "static/*.svg",
  "static/img/*.ico",
  "static/img/*.png",
  "static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using .* with .* is deprecated",
]
