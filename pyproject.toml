[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movistar-nbo"
version = "0.1.0"
description = "Motor reproducible de Next Best Offer para el reto de personalizacion comercial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "streamlit>=1.50",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
explain = ["shap>=0.46"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
nbo-train = "nbo.training:main"
nbo-evaluate = "nbo.evaluation:main"
nbo-batch = "nbo.batch:main"
nbo-report = "nbo.reporting:main"
nbo-audit = "nbo.audit:main"
nbo-demo = "nbo.demo:main"
nbo-check = "nbo.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
